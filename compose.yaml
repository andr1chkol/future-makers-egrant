services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: egrant
      POSTGRES_USER: egrant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:${DB_PORT:-55433}:5432"]
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U egrant -d egrant"]
      interval: 2s
      retries: 30
  api:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://egrant:${POSTGRES_PASSWORD}@db:5432/egrant
      FILE_STORAGE_PATH: /private/files
    command: ["sh", "-c", "uv run --no-sync alembic -c backend/alembic.ini upgrade head && uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    volumes: ["private-files:/private/files"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      retries: 30
  worker:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://egrant:${POSTGRES_PASSWORD}@db:5432/egrant
      FILE_STORAGE_PATH: /private/files
    command: ["uv", "run", "--no-sync", "python", "-m", "app.worker"]
    depends_on:
      api: {condition: service_healthy}
    volumes: ["private-files:/private/files"]
  frontend:
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
    environment:
      API_PROXY_TARGET: http://api:8000
    ports: ["127.0.0.1:5173:5173"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  database:
  private-files:
